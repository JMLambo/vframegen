name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Only main writes the cache; pull requests read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload the mod jar
        uses: actions/upload-artifact@v7
        with:
          name: vframegen-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error


  # VirusTotal scan of the jar (.github/scripts/virustotal.sh), on pull requests only: main only
  # changes through them, and release jars are scanned by the Release workflow.
  virustotal:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download the mod jar
        uses: actions/download-artifact@v8
        with:
          name: vframegen-${{ github.sha }}
          path: jars

      - name: Scan with VirusTotal
        env:
          VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: .github/scripts/virustotal.sh "$(ls jars/*.jar | grep -v -- '-sources\.jar$' | head -n1)"

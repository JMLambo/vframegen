name: Release

# Push a tag like v0.2.0 (matching mod_version in gradle.properties) to build the mod and publish
# a GitHub Release with the jar attached and notes generated from the commits since the last one,
# then upload the same jar to CurseForge (needs the CURSEFORGE_TOKEN secret; skipped without it).
# Run it by hand (Actions > Release > Run workflow) with an existing tag to redo only the CurseForge
# upload for that release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload to CurseForge (for example v1.0.0-beta.2)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0 # full history, for the generated release notes

      - name: Check the tag matches mod_version
        run: |
          version=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match mod_version=${version} (expected v${version})"
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Build
        run: ./gradlew build --stacktrace

      # Every jar that gets published, also one a manual run rebuilt from an older tag. The script
      # comes from the commit this workflow runs from: an older tag may not have it.
      - name: Scan with VirusTotal
        env:
          VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          git show "${GITHUB_SHA}:.github/scripts/virustotal.sh" > "${RUNNER_TEMP}/virustotal.sh"
          bash "${RUNNER_TEMP}/virustotal.sh" "$(ls build/libs/*.jar | grep -v -- '-sources\.jar$' | head -n1)"

      - name: Publish the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${TAG}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${TAG}" build/libs/*.jar \
            --title "VFrameGen ${TAG#v}" \
            --generate-notes --verify-tag ${prerelease}

      - name: Upload to CurseForge
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CF_PROJECT: '1822851'
        run: |
          if [ -z "${CF_TOKEN}" ]; then
            echo "::warning::CURSEFORGE_TOKEN is not set; skipping the CurseForge upload"
            exit 0
          fi
          version="${TAG#v}"
          mc=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          jar=$(ls build/libs/*.jar | grep -v -- '-sources\.jar$' | head -n1)
          api=https://minecraft.curseforge.com/api

          # Release type from the version: alphas and betas stay off the default file list.
          case "${version}" in
            *-alpha*) type=alpha ;;
            *-*) type=beta ;; # beta, rc and any other suffix: never a default download
            *) type=release ;;
          esac

          # Display name like "VFrameGen 1.0 Beta 1" (or "VFrameGen 1.2.0" for a release).
          base="${version%%-*}"
          name="VFrameGen ${version}"
          case "${version}" in
            *-beta.*) name="VFrameGen ${base%.0} Beta ${version##*-beta.}" ;;
            *-alpha.*) name="VFrameGen ${base%.0} Alpha ${version##*-alpha.}" ;;
          esac

          # This version's CHANGELOG.md section (between its heading and the next one).
          changelog=$(awk -v v="${version}" '
            $0 ~ "^## \\[?" v "([] ]|$)" { f = 1; next }
            /^## / { if (f) exit }
            f' CHANGELOG.md)
          [ -n "${changelog}" ] || changelog="See https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

          # CurseForge wants numeric ids for the game version, loader, Java and environment tags.
          # Names repeat across groups (26.3 is listed more than once), so each is matched within
          # its own group: the Minecraft version group, mod loaders, Java, and environment.
          curl -sfS -H "X-Api-Token: ${CF_TOKEN}" "${api}/game/versions" > versions.json
          curl -sfS -H "X-Api-Token: ${CF_TOKEN}" "${api}/game/version-types" > types.json
          ids=$(jq -c --arg mc "${mc}" --slurpfile types types.json '
            ($types[0] | map({key: (.id | tostring), value: .slug}) | from_entries) as $slug
            | def pick(name; ok): [ .[] | select(.name == name and ($slug[.gameVersionTypeID | tostring] // "" | ok)) ] | max_by(.id) | .id;
            [ pick($mc; startswith("minecraft")), pick("Fabric"; . == "modloader"),
              pick("Java 25"; . == "java"), pick("Client"; . == "environment") ]' versions.json)
          if echo "${ids}" | jq -e 'any(. == null)' > /dev/null; then
            echo "::error::Missing a CurseForge tag for one of (${mc}, Fabric, Java 25, Client): ${ids}"
            jq -c --arg mc "${mc}" '[ .[] | select(.name == $mc or .name == "Fabric" or .name == "Java 25" or .name == "Client") ]' versions.json
            jq -c '.' types.json | head -c 4000
            exit 1
          fi
          echo "CurseForge tags: ${ids}"

          metadata=$(jq -n \
            --arg changelog "${changelog}" --arg name "${name}" --arg type "${type}" --argjson ids "${ids}" \
            --argjson optional '["sodium", "irisshaders", "distant-horizons", "modmenu", "cloth-config", "controlify", "reflex-antilag"]' \
            '{changelog: $changelog, changelogType: "markdown", displayName: $name, releaseType: $type,
              gameVersions: $ids,
              relations: {projects: ([{slug: "fabric-api", type: "requiredDependency"}]
                + ($optional | map({slug: ., type: "optionalDependency"})))}}')
          curl -sfS -H "X-Api-Token: ${CF_TOKEN}" \
            --form-string "metadata=${metadata}" -F "file=@${jar}" \
            "${api}/projects/${CF_PROJECT}/upload-file"
          echo

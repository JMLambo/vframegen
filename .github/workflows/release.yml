name: Release

# Push a tag like v0.2.0 (matching mod_version in gradle.properties) to build the mod and publish
# a GitHub Release with the jar attached and notes generated from the commits since the last one.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, for the generated release notes

      - name: Check the tag matches mod_version
        run: |
          version=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match mod_version=${version} (expected v${version})"
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Alphas are pre-releases; betas and stable versions are full releases (shown as Latest).
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          title="VFrameGen ${version}"
          case "${version}" in
            *-alpha*) prerelease="--prerelease" ;;
            *-beta.*)
              base="${version%%-*}"; base="${base%.0}"
              title="VFrameGen ${base} Beta ${version##*-beta.}" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" build/libs/*.jar \
            --title "${title}" \
            --generate-notes --verify-tag ${prerelease}

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    runs {
        client {
            // Generational ZGC: garbage collection pauses of about a millisecond instead of 10-20 ms
            // (those pauses showed up as hitches, very visible with frame generation on).
            vmArgs "-XX:+UseZGC"
        }
    }
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Optional: in-game config screen. Not bundled; used only when both are installed.
    compileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }
    compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
        transitive = false
    }
    // ...and loaded in the dev client (runClient) so the screen can be tested.
    localRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }
    localRuntime("com.terraformersmc:modmenu:${project.modmenu_version}") {
        transitive = false
    }

    // Optional: controller buttons through Controlify (its API at compile time; it and YACL,
    // which it needs, in the dev client).
    compileOnly("maven.modrinth:controlify:${project.controlify_version}") { transitive = false }
    localRuntime("maven.modrinth:controlify:${project.controlify_version}") { transitive = false }
    localRuntime("maven.modrinth:yacl:${project.yacl_version}") { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
